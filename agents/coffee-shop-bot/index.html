<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop Bot - Главная</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 30px;
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 30px 90px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .emoji {
            font-size: 100px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #2C3E50;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 20px;
            margin-bottom: 40px;
        }

        .btn {
            display: inline-block;
            padding: 20px 50px;
            margin: 10px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 3px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
        }

        .links {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #ecf0f1;
        }

        .link-item {
            margin: 15px 0;
        }

        .link-item a {
            color: #3498db;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .link-item a:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        .icon {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">☕</div>
        <h1>Coffee Shop Bot</h1>
        <p class="subtitle">Telegram-бот для кофейни</p>

        <a href="view_bot.html" class="btn btn-primary">
            🚀 Открыть интерактивную демонстрацию
        </a>

        <br><br>

        <a href="Coffee_Shop_Bot_Documentation.pdf" class="btn btn-secondary" download>
            📄 Скачать PDF документацию
        </a>

        <div class="links">
            <div class="link-item">
                <span class="icon">💻</span>
                <a href="coffee_bot.py">Исходный код бота</a>
            </div>
            <div class="link-item">
                <span class="icon">📋</span>
                <a href="menu_data.py">Данные меню</a>
            </div>
            <div class="link-item">
                <span class="icon">📖</span>
                <a href="README.md">Полная документация</a>
            </div>
            <div class="link-item">
                <span class="icon">⚡</span>
                <a href="QUICKSTART.md">Быстрый старт</a>
            </div>
        </div>
    </div>
</body>
</html>
