name: Validate monitoring configuration

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python3 -m pip install --disable-pip-version-check yamllint

      - name: Check setup script
        run: shellcheck setup.sh

      - name: Lint YAML
        run: |
          yamllint \
            -d '{extends: default, rules: {line-length: disable, truthy: disable}}' \
            kind-config.yaml \
            prometheus-values.yaml \
            otel-collector-values.yaml \
            .github/workflows/validate.yml

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add chart repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Render Prometheus chart
        run: |
          helm template prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --values prometheus-values.yaml \
            > /tmp/prometheus-rendered.yaml

      - name: Render OpenTelemetry Collector chart
        run: |
          helm template opentelemetry-collector open-telemetry/opentelemetry-collector \
            --namespace otel-system \
            --values otel-collector-values.yaml \
            > /tmp/otel-rendered.yaml
